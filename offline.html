<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAT Word Study</title>
  <!-- Shown by sw.js when the app is opened with no internet connection. Kept
       self-contained (inline styles, cached icon) since nothing else can load. -->
  <style>
    :root { --bg: #f7f6f2; --text: #1f2328; --muted: #5f6670; --accent: #1f7a4d; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15171a; --text: #e8e6e1; --muted: #9aa1aa; --accent: #5cc48f; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { border-radius: 16px; }
    h1 { font-size: 1.3rem; margin: 14px 0 6px; }
    p { color: var(--muted); margin: 0 0 18px; max-width: 320px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 18px; background: var(--accent); color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { color: #10131a; } }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>You're offline</h1>
    <p>SAT Word Study needs the internet to load your words and save your progress. Connect to Wi-Fi or cellular data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
